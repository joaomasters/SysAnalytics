server:
  port: 8080

spring:
  application:
    name: sysanalytics-crm
  jackson:
    time-zone: America/Sao_Paulo
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sysanalytics}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD:crm}

  flyway:
    enabled: true             # o schema é versionado em src/main/resources/db/migration

  jpa:
    hibernate:
      ddl-auto: validate      # o Flyway é a única fonte do schema; o Hibernate só confere
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: America/Sao_Paulo
        jdbc.batch_size: 200
        order_inserts: true

  batch:
    jdbc:
      initialize-schema: always # cria as tabelas BATCH_* do Spring Batch
    job:
      enabled: false            # o job é disparado via endpoint/agendamento, não no startup

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:crm}
    password: ${RABBIT_PASSWORD:crm}
    listener:
      simple:
        default-requeue-rejected: false   # mensagens que falham vão para a DLX
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

crm:
  seed:
    enabled: ${CRM_SEED_ENABLED:true}     # DESLIGAR fora de desenvolvimento
    senha-padrao: ${CRM_SEED_SENHA:Trocar@123}
  security:
    # HS256: mínimo 32 caracteres. Em produção SEMPRE definir JWT_SECRET (o padrão abaixo é só para dev).
    jwt-secret: ${JWT_SECRET:dev-only-secret-troque-em-producao-0123456789}
    jwt-ttl-minutos: 480
  inatividade:
    # Execução automática diária (06:00) para cada empresa ativa. Manual: POST /api/v1/jobs/executar-analise-inatividade
    cron: "0 0 6 * * *"
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
